<svg xmlns="http://www.w3.org/2000/svg" width="760" height="248" viewBox="0 0 760 248" font-family="Helvetica,Arial,sans-serif"><rect width="760" height="248" fill="#fff"/><text x="12" y="22" font-size="14" text-anchor="start" fill="#222" font-weight="bold">Data-quality findings (rows / countries affected)</text><text x="12" y="39" font-size="10" text-anchor="start" fill="#777">2,363 country-years, 165 countries; 98.43% matched to World Bank GDP per capita</text><rect x="238" y="55.6" width="376.7" height="17.0" fill="#f2cc8f"/><text x="232" y="68" font-size="10" text-anchor="end" fill="#333">whr_panel: rows with &gt;= 1 missing factor (kept)</text><text x="619" y="68" font-size="9" text-anchor="start" fill="#444">266</text><rect x="238" y="79.9" width="52.4" height="17.0" fill="#f2cc8f"/><text x="232" y="92" font-size="10" text-anchor="end" fill="#333">fact: country-years without World Bank GDP per capita</text><text x="294" y="92" font-size="9" text-anchor="start" fill="#444">37</text><rect x="238" y="104.2" width="52.4" height="17.0" fill="#f2cc8f"/><text x="232" y="117" font-size="10" text-anchor="end" fill="#333">wb: WHR-country years 2005-2023 with population but no GDP</text><text x="294" y="117" font-size="9" text-anchor="start" fill="#444">37</text><rect x="238" y="128.5" width="31.2" height="17.0" fill="#f2cc8f"/><text x="232" y="141" font-size="10" text-anchor="end" fill="#333">country: region not in WHR 2024 ranking (explicit fallback</text><text x="273" y="141" font-size="9" text-anchor="start" fill="#444">22</text><rect x="238" y="152.8" width="25.5" height="17.0" fill="#f2cc8f"/><text x="232" y="165" font-size="10" text-anchor="end" fill="#333">country: WHR -&gt; World Bank name overrides applied</text><text x="267" y="165" font-size="9" text-anchor="start" fill="#444">18</text><rect x="238" y="177.1" width="25.5" height="17.0" fill="#f2cc8f"/><text x="232" y="190" font-size="10" text-anchor="end" fill="#333">whr_panel: country name recoded (Türkiye -&gt; Turkiye)</text><text x="267" y="190" font-size="9" text-anchor="start" fill="#444">18</text><rect x="238" y="201.4" width="2.8" height="17.0" fill="#f2cc8f"/><text x="232" y="214" font-size="10" text-anchor="end" fill="#333">country: no World Bank series (Taiwan, Somaliland)</text><text x="245" y="214" font-size="9" text-anchor="start" fill="#444">2</text><line x1="238" y1="52" x2="238" y2="222" stroke="#999"/></svg>
