<svg xmlns="http://www.w3.org/2000/svg" width="760" height="176" viewBox="0 0 760 176" font-family="Helvetica,Arial,sans-serif"><rect width="760" height="176" fill="#fff"/><text x="12" y="22" font-size="14" text-anchor="start" fill="#222" font-weight="bold">Ladder change by real GDP-per-capita growth quartile, 2006-10 to 2019-23</text><text x="12" y="39" font-size="10" text-anchor="start" fill="#777">10 countries; growth = change in WHR log GDP per capita (PPP, constant prices)</text><rect x="361.8" y="55.7" width="127.2" height="17.1" fill="#e07a5f"/><text x="232" y="68" font-size="10" text-anchor="end" fill="#333">G1 slowest (growth -2%, 0% happier)</text><text x="358" y="68" font-size="9" text-anchor="end" fill="#444">-0.904</text><rect x="489.0" y="80.2" width="39.5" height="17.1" fill="#81b29a"/><text x="232" y="93" font-size="10" text-anchor="end" fill="#333">G2 (growth +13%, 100% happier)</text><text x="533" y="93" font-size="9" text-anchor="start" fill="#444">+0.281</text><rect x="489.0" y="104.7" width="70.6" height="17.1" fill="#81b29a"/><text x="232" y="117" font-size="10" text-anchor="end" fill="#333">G3 (growth +26%, 50% happier)</text><text x="564" y="117" font-size="9" text-anchor="start" fill="#444">+0.502</text><rect x="489.0" y="129.2" width="206.9" height="17.1" fill="#81b29a"/><text x="232" y="142" font-size="10" text-anchor="end" fill="#333">G4 fastest (growth +52%, 100% happier)</text><text x="700" y="142" font-size="9" text-anchor="start" fill="#444">+1.471</text><line x1="489" y1="52" x2="489" y2="150" stroke="#999"/></svg>
